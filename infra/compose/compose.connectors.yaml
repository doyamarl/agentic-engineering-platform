# Connectors (ADR-013): people connect outside tools, such as Amplitude, with their own account,
# and their threads can read those tools. Turn on by adding this file, e.g. in infra/compose/.env:
#   COMPOSE_FILE=compose.yaml:compose.connectors.yaml
#   AEP_MASTER_KEY=<openssl rand -base64 32>
# The worker exchanges the authorization codes and seals the tokens with the master key, which
# only the worker reads; without a valid key it refuses to start. Losing the key loses every
# connection (people connect again), so keep a copy apart from the database backups.
# The redirect URI is the web UI as the browser reaches it; behind TLS, set your own address.
x-connectors: &connectors
  AEP_CONNECTORS_DIR: ${AEP_CONNECTORS_DIR:-/repo/connectors}
  AEP_CONNECTOR_REDIRECT_URI: ${AEP_CONNECTOR_REDIRECT_URI:-http://127.0.0.1:3001/connections/oauth/callback}

services:
  api:
    environment:
      <<: *connectors

  worker:
    environment:
      <<: *connectors
      AEP_MASTER_KEY_FILE: /run/secrets/master_key
    secrets: [master_key]

secrets:
  master_key:
    environment: AEP_MASTER_KEY
